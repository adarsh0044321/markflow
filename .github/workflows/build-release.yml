name: Build & Release MarkFlow APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Unsigned Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Extract Version Name
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName\s*=\s*"\(.*\)".*/\1/p' app/build.gradle.kts)
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV

      - name: Set Release Tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_ENV
          else
            echo "TAG_NAME=v${{ env.VERSION_NAME }}-build.${{ github.run_number }}" >> $GITHUB_ENV
          fi

      - name: Create Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.TAG_NAME }}
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
          body: |
            ## MarkFlow Android Application Release ${{ env.TAG_NAME }}
            
            This release contains the compiled APK binaries for **MarkFlow**—the professional-grade answer sheet scanner and evaluation application.
            
            ### 📦 Release Artifacts
            * 🟢 **`app-debug.apk`**: The debug version of the application. Recommended for testing and immediate sideloading.
            * 🔵 **`app-release-unsigned.apk`**: The unsigned production release version. Optimised and minified using R8. (Must be signed with a keystore before installation on standard devices).
            
            ---
            
            ### 🚀 Implemented Capabilities & Features
            
            #### 1. Document-First Scanning & Image Processing
            * **Automatic Perspective Rectification**: Built-in OpenCV corner point analysis and warps to flat projection grids.
            * **Adaptive Background Cleaning**: Erases creases, background shadows, and table desk surfaces while keeping red and dark inks crisp.
            
            #### 2. Digital Spirit Level (Alignment Assistant)
            * **Parallel Guidance**: Tracks real-time accelerometer tilt relative to a flat plane.
            * **Auto-Capture Lockout**: Auto-capturing is restricted if the tilt exceeds 10° to prevent perspective stretching.
            
            #### 3. Flash & Light Sensor Automation
            * **Ambient Light Tracking**: Utilises the device light sensor to automatically enable the camera torch in low-light environments (lux < 15).
            * **Manual Control modes**: Toggle between `ON`, `OFF`, and `AUTO` states dynamically.
            
            #### 4. Direct Annotations
            * **Draw Red Ink Checks**: Direct screen canvas finger drawings are converted to raw coordinate grids.
            * **In-place Writing**: Re-writes annotations directly onto the source bitmap in local storage.
            
            #### 5. Session Cohorts Dashboarding
            * **Dynamic Selector**: Easily switch between session groups.
            * **Advanced Statistics**: View averages, medians, grade bands (A, B, C, D, F) with visual progress bar charts, and search/sort roll numbers.
            
            #### 6. PDF Export with Cover Sheet
            * **Report Covers**: Emits a standardized coversheet containing metadata, student scores, percentages, grade indicators, comments, and signature zones.
            
            ---
            
            ### 🔧 Tech Stack Highlights
            * **Jetpack Compose** & **Material 3**
            * **Jetpack CameraX**
            * **OpenCV Android SDK**
            * **ML Kit Text OCR** & **TensorFlow Lite**
            * **Room Database** & **Hilt DI**
            * **iText PDF** & **Apache POI**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

